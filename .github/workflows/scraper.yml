name: Facebook Scraper Wöchentlich

on:
  schedule:
    # Läuft jeden Montag um 8:00 UTC
    - cron: '0 8 * * 1'
  workflow_dispatch: # Ermöglicht manuelles Auslösen

jobs:
  scrape:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.3.2'
      
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev
      
      - name: Install R Packages
        run: |
          Rscript -e 'install.packages("pak")'
          Rscript -e 'pak::pak(c("favstats/metatargetr", "tidyverse", "lubridate", "scales"))'
      
      - name: Run Scraper
        run: Rscript facebook_scraper.R
      
      - name: Commit and Push Results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add results/
          git diff --quiet && git diff --staged --quiet || git commit -m "Update Facebook Likes - $(date +'%Y-%m-%d')"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
